# Quick-Survey 配置文件
# 复制此文件为 config.yml 并修改配置

# 服务器配置
server:
  host: "0.0.0.0"
  port: 8000
  debug: false

# 数据库配置
database:
  # SQLite 数据库路径
  url: "sqlite+aiosqlite:///./data/survey.db"

# 认证配置 (与 Java 端共享)
auth:
  # 从 Java 端 config.yml 复制 admin-password 的值
  admin_password: "your-admin-password-here"
  # JWT 签名密钥, 必须与 mod 配置文件里的 jwt-secret 逐字符一致,
  # 否则面板登录后调问卷管理端会全部 401
  jwt_secret: "your-jwt-secret-here"

# Convenient-access mod 后端对接 (玩家凭 token 自助领取注册码时, 问卷后端以服务端身份调 mod)
mod:
  # mod API 基址, 形如 https://api.mcwok.cn:22222 (不含末尾斜杠); 留空则领码功能返回 503
  api_base: ""
  # mod 的 API Token (对应 Java 端 config.yml 的 api-token), 作 X-API-Key 头发送
  api_key: ""

# 内部接口鉴权 (供 NapCat 插件调用: 查过审 QQ、轮询审核群通知队列)
internal:
  # 共享 token, 必须与 NapCat 插件配置一致; 留空则内部接口拒绝所有请求
  token: ""

# 文件上传配置
upload:
  # 上传文件存储目录
  path: "./uploads"
  # 允许的图片类型
  allowed_types: ["image/jpeg", "image/png", "image/gif", "image/webp"]
  # 最大文件大小 (MB)
  max_size_mb: 10

# CORS 配置
cors:
  allowed_origins: 
    - "https://panel.mcwok.cn"
    - "http://localhost:5173"
    - "http://localhost:5174"

# 安全配置
security:
  # Cloudflare Turnstile 配置
  turnstile:
    # 是否启用 Turnstile 验证
    enabled: false
    # Turnstile Secret Key (从 Cloudflare Dashboard 获取)
    secret_key: ""
    # siteverify 端点。部分国内机房 (实测阿里云广州) 到 challenges.cloudflare.com 的
    # TLS 握手会被中途阻断, 此时填一台线路通畅的机器上的 nginx 中转地址;
    # 线路正常的机房保持默认直连即可。
    verify_url: "https://challenges.cloudflare.com/turnstile/v0/siteverify"
    # siteverify 不可达时是否放行提交。关掉则网络一断所有人都提交不了;
    # 打开则降级放行并记 WARNING 日志, 由 IP 限流/耗时检测/人工审核兜底。
    fail_open: true
  
  # IP 提交限制
  rate_limit:
    # 是否启用 IP 限制
    enabled: true
    # 同一 IP 每天最大提交次数
    max_submissions_per_day: 3
  
  # 提交时间检测
  time_check:
    # 是否启用时间检测
    enabled: true
    # 最小填写时间（秒），低于此时间视为可疑
    min_submit_time: 5

# 清理任务配置
cleanup:
  # 是否启用自动清理
  enabled: false
  # 清理间隔（天）
  interval_days: 1
  # 每天执行时间（小时，0-23，如 3 表示凌晨3点）
  run_hour: 3
  # 孤立文件超过多少小时后删除
  orphan_file_hours: 24
