# Cloudflare Turnstile siteverify 中转 (部署在中转机, 非问卷机)
#
# 背景: 问卷后端所在的阿里云广州机房 (8.148.217.146) 到 challenges.cloudflare.com 的
# TLS 握手会被中途阻断 —— TCP 连得上、Client Hello 发得出、Server Hello 也收得到,
# 之后连接卡死至超时。2026-07-19 起出现, 至 07-26 实测 siteverify 失败率 85%
# (14 天内 122 次验证 / 104 次网络错误), 导致真人用户提交被 500 拒绝。
# 同账号的深圳机 (120.24.184.115) 到同一端点 5/5 通畅, 故借其转发。
#
# 部署: 把下面的 location 块粘进中转机上一个已有 HTTPS 站点的 server 块
# (当前挂在 panel.mcwok.cn 的 443 下, 复用其 Let's Encrypt 证书), 然后:
#   nginx -t && systemctl reload nginx
# 再把问卷后端 config.yml 的 security.turnstile.verify_url 指向该地址。
#
# 必须走 HTTPS: 请求体里带 Turnstile secret_key, 明文 HTTP 会让密钥在公网裸奔。
# 线路恢复后把 verify_url 改回 Cloudflare 官方地址即可下线本中转。

location = /cf-turnstile/siteverify {
    # 只放行问卷机源 IP。该中转会把请求原样转给 Cloudflare, 不做鉴权,
    # 敞开等于给任何人一个匿名转发点。
    allow 8.148.217.146;
    deny all;

    resolver 223.5.5.5 119.29.29.29 valid=300s;
    resolver_timeout 5s;

    # proxy_pass 带变量才会走 resolver 做运行时解析;
    # 写成字面量的话 nginx 启动时就解析 DNS, 解析失败会导致整个 nginx 起不来。
    set $turnstile_siteverify "https://challenges.cloudflare.com/turnstile/v0/siteverify";
    proxy_pass $turnstile_siteverify;

    proxy_ssl_server_name on;
    proxy_set_header Host challenges.cloudflare.com;
    proxy_set_header Accept-Encoding "";

    # 后端 httpx 侧超时 10s, 这里留出余量以便中转层先超时并返回可诊断的响应
    proxy_connect_timeout 5s;
    proxy_send_timeout 8s;
    proxy_read_timeout 8s;

    access_log /var/log/nginx/cf-turnstile-relay.log;
}
